# =============================================================================
# competition_track.yaml
# ROBOFEST competition map metadata
#
# This file is the companion to competition_track.pgm (the occupancy grid image).
# It is generated by slam_toolbox when the map is saved.
#
# HOW TO BUILD THE MAP:
#   1. Launch the rover in mapping mode (slam_params.yaml mode: mapping)
#   2. Manually drive the rover around the full competition course
#   3. Save the map: ros2 run nav2_map_server map_saver_cli -f maps/competition_track
#   4. This file and competition_track.pgm will be generated automatically.
#   5. Change slam_params.yaml mode: localization before competition.
#
# Status: PLACEHOLDER — overwrite with actual saved map.
# =============================================================================

image: competition_track.pgm

# Map resolution in metres per pixel.
# Typical slam_toolbox value: 0.05 (5 cm/pixel)
resolution: 0.05   # TBD — set by slam_toolbox when saving

# Origin of the map [x, y, yaw] in world coordinates.
# The lower-left corner of the image corresponds to this pose.
origin: [-5.0, -5.0, 0.0]   # TBD — set by slam_toolbox when saving

# Pixel value interpretation:
#   occupied_thresh: pixels with value > this are OCCUPIED
#   free_thresh:     pixels with value < this are FREE
#   Pixels in between are UNKNOWN
occupied_thresh: 0.65
free_thresh: 0.25

# Negate the occupancy values in the image?
# 0 = white pixels are free, black pixels are occupied (standard)
negate: 0

# =============================================================================
# mission.yaml
# Competition mission configuration for the ROBOFEST rover
#
# Status: PLANNED — waypoint coordinates are placeholders.
#         Must be filled in after mapping the competition track.
#
# HOW TO USE:
#   1. Build a map of the competition track using slam_toolbox (Mode B).
#   2. Drive through the course manually and record waypoint poses in the map.
#   3. Fill in the waypoints below using the recorded (x, y, yaw) values.
#   4. Set slam_params.yaml mode: localization before competition.
# =============================================================================

mission_manager_node:
  ros__parameters:

    # Total number of rounds to complete (6 or 7, as per competition rules)
    total_rounds: 7

    # Maximum number of recovery attempts before declaring failure
    max_recovery_attempts: 3

    # Per-round timeout (seconds). If a round is not completed within this
    # time, recovery is triggered.
    round_timeout_s: 300.0

    # Timeout for waiting for a dynamic obstacle to clear (seconds)
    obstacle_wait_timeout_s: 10.0

    # Distance from waypoint at which it is considered "reached" (metres)
    waypoint_tolerance_m: 0.25    # TBD — tune on hardware

    # Heading tolerance at waypoint (radians)
    waypoint_heading_tolerance_rad: 0.2  # TBD

    # Parking zone identifier
    parking_zone_id: zone_A

    # ── Per-round waypoints ───────────────────────────────────────────────────
    # Format: [x, y, yaw_rad] in the map frame.
    # yaw: 0 = East (+x), pi/2 = North (+y), -pi/2 = South (-y), pi = West
    # ALL COORDINATES ARE PLACEHOLDERS — replace after mapping the course.

    waypoints:
      round_1:
        - {x: 0.0,  y: 0.0,  yaw: 0.0,  label: "start"}
        - {x: 2.0,  y: 0.0,  yaw: 0.0,  label: "wp1_1"}
        - {x: 4.0,  y: 1.0,  yaw: 1.57, label: "wp1_2"}
        - {x: 4.0,  y: 3.0,  yaw: 3.14, label: "wp1_finish"}

      round_2:
        - {x: 4.0,  y: 3.0,  yaw: 3.14, label: "start"}
        - {x: 2.0,  y: 3.0,  yaw: 3.14, label: "wp2_1"}
        - {x: 0.0,  y: 0.0,  yaw: 0.0,  label: "wp2_finish"}

      round_3:
        - {x: 0.0, y: 0.0, yaw: 0.0, label: "placeholder"}

      round_4:
        - {x: 0.0, y: 0.0, yaw: 0.0, label: "placeholder"}

      round_5:
        - {x: 0.0, y: 0.0, yaw: 0.0, label: "placeholder"}

      round_6:
        - {x: 0.0, y: 0.0, yaw: 0.0, label: "placeholder"}

      round_7:
        - {x: 0.0, y: 0.0, yaw: 0.0, label: "placeholder"}

    # ── Parking zone definition ───────────────────────────────────────────────
    parking_zones:
      zone_A:
        approach_pose:  {x: 0.0, y: 0.0, yaw: 0.0}  # TBD — approach point
        target_pose:    {x: 0.0, y: 0.0, yaw: 0.0}  # TBD — final stop point
        parking_target_distance_m: 0.20               # TBD — front distance to wall
        center_error_threshold_m:  0.05               # TBD — lateral tolerance
        approach_speed_m_s:        0.10               # TBD — slow approach speed

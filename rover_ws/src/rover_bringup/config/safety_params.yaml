# =============================================================================
# safety_params.yaml
# Safety controller parameters for the ROBOFEST rover
#
# Status: PLANNED — all distance/speed thresholds are TBD.
#         Must be tuned by physical testing on the competition course.
#
# These parameters govern:
#   - Velocity caps
#   - Obstacle distance zones
#   - Sensor watchdog timeouts
#   - Battery thresholds
#   - Tilt limits
# =============================================================================

safety_controller_node:
  ros__parameters:

    # ── Velocity Limits ───────────────────────────────────────────────────────
    # Maximum allowed linear velocity (m/s) in normal navigation.
    # Safety controller clamps /cmd_vel to this before forwarding to Arduino.
    max_linear_velocity: 0.5      # TBD — tune on course

    # Maximum allowed angular velocity (rad/s)
    max_angular_velocity: 1.0     # TBD

    # Maximum linear acceleration (m/s²) — prevents wheel slip on acceleration
    max_linear_acceleration: 0.3  # TBD

    # Maximum angular acceleration (rad/s²)
    max_angular_acceleration: 1.0 # TBD

    # Reduced velocity used during slow approach / danger zone
    slow_linear_velocity: 0.15    # TBD

    # ── Obstacle Distance Zones ───────────────────────────────────────────────
    # Distance thresholds for front-facing ToF and ultrasonic sensors.
    # Distances are in metres.

    # Below this → IMMEDIATE SOFTWARE STOP (/emergency_stop = true)
    estop_distance_m: 0.15        # TBD

    # Below this → reduce speed to slow_linear_velocity
    slow_zone_distance_m: 0.50    # TBD

    # Below this → begin deceleration
    warning_zone_distance_m: 1.00 # TBD

    # ── Sensor Watchdog Timeouts (seconds) ───────────────────────────────────
    # If a topic has not been received within this timeout, the sensor is
    # considered failed and the appropriate fail-safe is triggered.

    # LiDAR — critical sensor. Timeout → reduce speed.
    sensor_timeout_lidar_s: 0.5

    # ToF — safety sensor. Timeout → increase safety margins.
    sensor_timeout_tof_s: 0.5

    # Ultrasonic — backup sensor. Timeout → log warning only.
    sensor_timeout_ultrasonic_s: 1.0

    # IMU — orientation sensor. Timeout → use encoder only.
    sensor_timeout_imu_s: 0.5

    # Arduino serial — motor controller. Timeout → emergency stop.
    arduino_timeout_s: 0.5

    # cmd_vel — if no command received, stop.
    cmd_vel_timeout_s: 0.3

    # ── Battery Thresholds (volts) ────────────────────────────────────────────
    # Measured at battery terminals (after BMS). TBD — verify with BMS specs.

    # Below this → reduce max speed and warn operator
    battery_low_v: 21.0           # TBD — for 6S Li-ion this is ~3.5V/cell

    # Below this → immediate stop and lock motors
    battery_critical_v: 19.2      # TBD — for 6S Li-ion this is ~3.2V/cell

    # ── Tilt Limits (degrees) ─────────────────────────────────────────────────
    # IMU roll and pitch. If either exceeds limit, stop immediately.
    # Prevents tip-over or driving off elevated surfaces.
    max_roll_deg: 30.0            # TBD — must be tested on representative terrain
    max_pitch_deg: 30.0           # TBD

    # ── Topic Names ───────────────────────────────────────────────────────────
    # All topic names must match across the entire system.
    topic_cmd_vel_in:  /cmd_vel
    topic_cmd_vel_out: /cmd_vel_safe
    topic_emergency_stop: /emergency_stop
    topic_tof_left:   /tof/front_left
    topic_tof_center: /tof/front_center
    topic_tof_right:  /tof/front_right
    topic_us_front:   /ultrasonic/front
    topic_us_rear:    /ultrasonic/rear
    topic_imu:        /imu/data
    topic_battery:    /battery/status
    topic_diagnostics: /diagnostics
